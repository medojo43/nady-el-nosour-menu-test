<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082d25"><title>منيو نادي النسور</title><style>
:root{--g:#082d25;--g2:#104638;--gold:#d7b65f;--paper:#fffdf7;--ink:#24332e}*{box-sizing:border-box}body{margin:0;background:#f3f0e6;color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#f8e6ae;text-align:center;padding:24px 14px;border-bottom:4px solid var(--gold)}h1{margin:0;font-size:25px}.sub{margin-top:7px;font-size:13px}main{max-width:900px;margin:18px auto;padding:0 12px}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.nav button,.cat{border:1px solid var(--gold);border-radius:13px;background:var(--g);color:#f8e6ae;padding:15px 8px;font-size:16px;font-weight:bold;cursor:pointer}.panel{display:none;background:var(--paper);border:1px solid #e2d5ad;border-radius:14px;padding:14px;margin-top:14px}.panel.active{display:block}.back{background:transparent;border:0;color:var(--g);font-weight:bold;font-size:15px;padding:5px 0 12px}.cats{display:flex;flex-wrap:wrap;gap:8px}.cat{font-size:14px;padding:10px 12px}.cat.active{background:var(--gold);color:var(--g)}.items{margin-top:12px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 8px;border-bottom:1px solid #e9e0c9}.name{font-weight:bold}.prices{font-size:13px;text-align:left;white-space:nowrap;color:#735719}.empty{text-align:center;padding:20px;color:#777}footer{text-align:center;color:#e9d79f;background:var(--g);padding:16px;margin-top:24px}@media(max-width:420px){h1{font-size:22px}.nav button{font-size:14px}}
</style></head><body><header><h1>نادي النسور</h1><div class="sub">المنيو الإلكتروني • دار القوات الجوية</div></header><main><div id="home" class="nav"></div><section id="section" class="panel"><button class="back" onclick="showHome()">← الرجوع للأقسام</button><h2 id="sectionTitle"></h2><div id="cats" class="cats"></div><div id="items" class="items"></div></section><div id="status" class="empty">جاري تحميل المنيو...</div></main><footer>نادي النسور • المنيو الإلكتروني</footer><script>
let all=[];const home=document.querySelector('#home'),panel=document.querySelector('#section'),cats=document.querySelector('#cats'),items=document.querySelector('#items'),statusBox=document.querySelector('#status');
function showHome(){panel.classList.remove('active');home.style.display='grid';statusBox.style.display='none'}
function showSection(name){home.style.display='none';statusBox.style.display='none';panel.classList.add('active');document.querySelector('#sectionTitle').textContent=name;const subset=all.filter(x=>x.section===name);const names=[...new Set(subset.map(x=>x.category||'أصناف متنوعة'))];cats.innerHTML='';items.innerHTML='';names.forEach((c,i)=>{const b=document.createElement('button');b.className='cat'+(i===0?' active':'');b.textContent=c;b.onclick=()=>showCategory(name,c,b);cats.append(b)});if(names.length)showCategory(name,names[0],cats.firstChild);}
function showCategory(section,category,btn){[...cats.children].forEach(x=>x.classList.toggle('active',x===btn));const list=all.filter(x=>x.section===section&&(x.category||'أصناف متنوعة')===category);items.innerHTML=list.map(x=>`<div class="item"><div class="name">${esc(x.item)}${x.notes?`<div style="font-size:12px;font-weight:normal;color:#777">${esc(x.notes)}</div>`:''}</div><div class="prices">${x.civilian_price!=null?`مدني: ${x.civilian_price}`:''}${x.member_price!=null?`<br>عضو الدار: ${x.member_price}`:''}</div></div>`).join('')||'<div class="empty">لا توجد أصناف في هذا التصنيف</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fetch('/api/menu').then(r=>r.json()).then(d=>{all=d.items||[];const sections=[...new Set(all.map(x=>x.section))];home.innerHTML='';sections.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>showSection(s);home.append(b)});statusBox.style.display='none'}).catch(()=>statusBox.textContent='تعذر تحميل المنيو. يرجى المحاولة لاحقًا.');
</script></body></html>
