
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082d25">
<title>دار القوات الجوية (نادي النسور) | MENU</title>

<style>
:root {
  --green:#082d25;
  --green2:#124a38;
  --gold:#d7b65f;
  --gold2:#f1d98e;
  --paper:#fffdf7;
}
*{box-sizing:border-box}

body{
  margin:0;
  background:#f0eee6;
  color:#24332d;
  font-family:Tahoma,Arial,sans-serif;
}

/* الواجهة الرئيسية */
.hero{
  background:
    radial-gradient(ellipse at center,#1b5741 0%,#082d25 65%,#041a15 100%);
  border-bottom:5px solid var(--gold);
  overflow:hidden;
  position:relative;
}

.hero-art{
  width:100%;
  height:230px;
  display:block;
}

.hero-title{
  background:linear-gradient(120deg,#071d18,#14513c,#071d18);
  color:var(--gold2);
  text-align:center;
  padding:14px 10px 18px;
  border-top:1px solid #b99a4e;
}

.hero-title strong{
  display:block;
  font-size:clamp(21px,5vw,32px);
}

.hero-title span{
  display:block;
  font:700 22px Georgia,serif;
  letter-spacing:7px;
  margin-top:5px;
  color:#fff0bd;
}

/* الأقسام الرئيسية */
main{
  max-width:1000px;
  margin:18px auto;
  padding:0 12px;
}

.section-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.section-card{
  border:2px solid var(--gold);
  border-radius:16px;
  padding:0;
  overflow:hidden;
  background:linear-gradient(145deg,#124a38,#06271f);
  color:#fff1bd;
  box-shadow:0 5px 14px #0002;
  cursor:pointer;
  text-align:center;
  transition:transform .2s,box-shadow .2s;
}

.section-card:active{
  transform:scale(.97);
}

.section-card .art{
  display:block;
  width:100%;
  aspect-ratio:1.9/1;
  background:radial-gradient(ellipse,#23664c,#082d25);
}

.section-card .art svg{
  display:block;
  width:100%;
  height:100%;
}

.section-card span{
  display:block;
  padding:13px 7px;
  font-weight:bold;
  font-size:16px;
  border-top:1px solid #b99a4e;
}

/* محتوى الأقسام */
.panel{
  display:none;
  background:var(--paper);
  border:1px solid #e2d5ad;
  border-radius:16px;
  padding:14px;
  margin-top:16px;
}

.panel.active{display:block}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border-bottom:2px solid var(--gold);
  padding-bottom:10px;
  margin-bottom:12px;
}

.panel-head h2{
  margin:0;
  color:var(--green);
  font-size:20px;
}

.back,.cat{
  border:1px solid var(--gold);
  border-radius:9px;
  background:var(--green);
  color:#fff0bd;
  padding:10px;
  font-weight:bold;
  cursor:pointer;
}

.cats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.cat.active{
  background:var(--gold);
  color:var(--green);
}

/* جدول الأصناف والأسعار */
.item-table{
  margin-top:14px;
  border:1px solid #d9c58a;
  border-radius:12px;
  overflow:hidden;
}

.item-head,.item-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 90px 90px;
  align-items:stretch;
}

.item-head{
  background:linear-gradient(90deg,#d7b65f,#f1d98e);
  color:#172b22;
  font-weight:bold;
  text-align:center;
}

.item-head>div{
  padding:10px 5px;
  border-left:1px solid #a78a43;
}

.item-row{
  background:#fffef9;
  border-top:1px solid #eadfbd;
}

.item-row:nth-child(odd){
  background:#f8f4e9;
}

.item-name{
  padding:12px 10px;
  text-align:right;
  font-weight:bold;
  align-self:center;
  overflow-wrap:anywhere;
}

.price{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 4px;
  text-align:center;
  border-right:1px solid #eadfbd;
  color:#5e4a19;
  font-weight:bold;
}

/* أرقام التليفونات القابلة للاتصال */
.phone-value{
  grid-column:2/4;
  display:block;
  direction:ltr;
  text-align:left;
  padding:12px 10px;
  color:var(--green);
  font-weight:bold;
  text-decoration:none;
  align-self:center;
}

.phone-value:active{
  color:#9a762d;
  text-decoration:underline;
}

.note{
  font-size:11px;
  color:#777;
  margin-top:4px;
}

.loading,.empty{
  padding:20px;
  text-align:center;
  color:#777;
}

.admin{
  display:block;
  width:max-content;
  margin:18px auto 0;
  border:1px solid var(--gold);
  border-radius:10px;
  padding:10px 22px;
  color:var(--gold2);
  background:var(--green);
  text-decoration:none;
  font-weight:bold;
}

footer{
  margin-top:24px;
  background:var(--green);
  color:#ead69b;
  text-align:center;
  padding:17px 10px;
  border-top:3px solid var(--gold);
}

@media(min-width:650px){
  .section-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .hero-art{height:310px}
}

@media(max-width:380px){
  .item-head,.item-row{
    grid-template-columns:minmax(0,1fr) 76px 76px;
  }
  .item-head>div{font-size:12px}
  .item-name,.price{font-size:13px}
  .section-card span{font-size:14px}
}
</style>
</head>

<body>

<header class="hero">

<!-- رسم النسر والطائرات -->
<svg class="hero-art" viewBox="0 0 1000 420"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="نسر وطائرات">

<defs>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f5df9b"/>
    <stop offset=".5" stop-color="#c49b42"/>
    <stop offset="1" stop-color="#775b25"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff0bd"/>
    <stop offset="1" stop-color="#b18b3e"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>

<circle cx="500" cy="205" r="170" fill="#d7b65f"
        opacity=".07" filter="url(#glow)"/>

<!-- الطائرة الأولى -->
<g fill="#e5cf8b" opacity=".65"
   transform="translate(145 90) scale(.8)">
  <path d="M0 45 L90 30 L125 0 L140 0 L128 31
  L205 40 L215 49 L128 55 L142 83 L128 83
  L90 58 L0 54 Z"/>
</g>

<!-- الطائرة الثانية -->
<g fill="#e5cf8b" opacity=".45"
   transform="translate(740 115) scale(-.7 .7)">
  <path d="M0 45 L90 30 L125 0 L140 0 L128 31
  L205 40 L215 49 L128 55 L142 83 L128 83
  L90 58 L0 54 Z"/>
</g>

<!-- جناح النسر الأيسر -->
<path d="M500 190
 C420 125 330 90 230 78
 L300 125 L170 106 L250 155
 L115 150 L220 190 L90 202
 L250 225 L350 242 L475 275 Z"
 fill="url(#wing)" stroke="#f4dda0" stroke-width="3"/>

<!-- جناح النسر الأيمن -->
<path d="M500 190
 C580 125 670 90 770 78
 L700 125 L830 106 L750 155
 L885 150 L780 190 L910 202
 L750 225 L650 242 L525 275 Z"
 fill="url(#wing)" stroke="#f4dda0" stroke-width="3"/>

<!-- جسم النسر -->
<path d="M500 125
 C450 150 445 215 470 265
 L500 320 L530 265
 C555 215 550 150 500 125Z"
 fill="url(#body)" stroke="#f1d98e" stroke-width="3"/>

<!-- رأس النسر -->
<path d="M500 115
 C465 105 450 75 470 55
 C485 42 505 49 515 62
 L545 80 L520 85
 C540 110 520 125 500 115Z"
 fill="#f1d98e"/>

<!-- المنقار -->
<path d="M520 79 L550 92 L519 98Z" fill="#c99e42"/>

<!-- ريش الجناحين -->
<g fill="none" stroke="#725421" stroke-width="3" opacity=".8">
  <path d="M475 190 L270 125 M455 210 L215 170
  M460 235 L185 210 M525 190 L730 125
  M545 210 L785 170 M540 235 L815 210"/>
</g>

<!-- خط زخرفي -->
<path d="M140 345 H860" stroke="#d7b65f"
      stroke-width="2" opacity=".7"/>
<circle cx="500" cy="345" r="5" fill="#f1d98e"/>

</svg>

<div class="hero-title">
  <strong>دار القوات الجوية (نادي النسور)</strong>
  <span>MENU</span>
</div>
</header>

<main>

<div id="home" class="section-grid">
  <div class="loading">جاري تحميل المنيو...</div>
</div>

<section id="sectionPanel" class="panel">

  <div class="panel-head">
    <h2 id="sectionTitle"></h2>
    <button class="back" onclick="showHome()">
      الأقسام الرئيسية
    </button>
  </div>

  <div id="categories" class="cats"></div>
  <div id="items" class="item-table"></div>

</section>

<a class="admin" href="/admin.html">
  دخول لوحة الإدارة
</a>

</main>

<footer>
أهلاً وسهلاً بكم في دار القوات الجوية (نادي النسور)
</footer>

<script>

/* الأقسام الرئيسية الخمسة */
const SECTIONS=[
  {name:"الميراج",art:"mirage"},
  {name:"المطعم الرئيسي",art:"restaurant"},
  {name:"مطعم الفندق",art:"hotel"},
  {name:"كافتريا الحديقة",art:"garden"},
  {name:"دليل التليفونات الداخلية",art:"phone"}
];

/* رسومات الأقسام */
function sectionArtwork(type){

const commonStart=`
<svg viewBox="0 0 380 190"
xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#f5df9b"/>
  <stop offset="1" stop-color="#b68d3c"/>
 </linearGradient>
</defs>
<g fill="none" stroke="url(#g)"
stroke-width="5" stroke-linecap="round"
stroke-linejoin="round">`;

const commonEnd=`
</g>
<circle cx="190" cy="95" r="78"
stroke="#d7b65f" stroke-width="1"
opacity=".25" fill="none"/>
</svg>`;

let drawing="";

if(type==="mirage"){
drawing=`
<!-- بيتزا -->
<path d="M90 130 L190 35 L290 130 Z"/>
<path d="M90 130 Q190 165 290 130"/>
<circle cx="190" cy="105" r="13"/>
<circle cx="145" cy="118" r="9"/>
<circle cx="235" cy="118" r="9"/>
<path d="M190 35 L210 135"/>
<path d="M125 100 Q190 70 255 100"/>
`;
}

else if(type==="restaurant"){
drawing=`
<!-- طبق تقديم -->
<ellipse cx="190" cy="105" rx="110" ry="48"/>
<ellipse cx="190" cy="105" rx="83" ry="32"/>
<path d="M135 105 Q155 65 190 90 Q220 55 250 105"/>
<path d="M170 92 L190 73 L210 92"/>
<path d="M90 45 L90 135 M75 45 L75 90
M105 45 L105 90"/>
<path d="M290 45 L290 135 M275 45 L275 90
M305 45 L305 90"/>
`;
}

else if(type==="hotel"){
drawing=`
<!-- مبنى الفندق -->
<path d="M115 150 V55 H265 V150 Z"/>
<path d="M100 150 H280"/>
<path d="M145 55 V35 H235 V55"/>
<path d="M145 75 H165 V95 H145 Z
M215 75 H235 V95 H215 Z
M145 110 H165 V130 H145 Z
M215 110 H235 V130 H215 Z"/>
<path d="M180 150 V115 H200 V150"/>
<path d="M190 35 V20"/>
`;
}

else if(type==="garden"){
drawing=`
<!-- شجرة ومشروب -->
<path d="M115 150 V105"/>
<path d="M115 105 Q75 85 100 55
Q120 30 145 55 Q175 75 140 105"/>
<path d="M115 100 L75 125 M115 100 L155 125"/>
<path d="M220 60 H270 L260 150 H230 Z"/>
<path d="M245 60 V35 H275"/>
<path d="M235 90 H265"/>
<path d="M245 45 L230 20"/>
`;
}

else if(type==="phone"){
drawing=`
<!-- هاتف -->
<rect x="145" y="20" width="90" height="150" rx="14"/>
<path d="M165 40 H215"/>
<circle cx="190" cy="150" r="6"/>
<path d="M165 65 H215 M165 85 H215
M165 105 H215 M165 125 H215"/>
`;
}

return commonStart+drawing+commonEnd;
}

/* بيانات الأقسام */
let allItems=[];

const home=document.getElementById("home");
const panel=document.getElementById("sectionPanel");
const categories=document.getElementById("categories");
const itemsBox=document.getElementById("items");

/* حماية النصوص */
function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

/* ترتيب الأصناف */
function sortItems(a,b){
return String(a.sort_order??"").localeCompare(
String(b.sort_order??""),
undefined,
{numeric:true}
);
}

/* الرجوع للرئيسية */
function showHome(){
panel.classList.remove("active");
home.style.display="grid";
window.scrollTo({top:0,behavior:"smooth"});
}

/* فتح القسم */
function showSection(name){

const rows=allItems
.filter(x=>x.section===name)
.sort(sortItems);

document.getElementById("sectionTitle").textContent=name;

home.style.display="none";
panel.classList.add("active");

const cats=[
...new Set(rows.map(x=>x.category||"أصناف متنوعة"))
];

categories.innerHTML="";
itemsBox.innerHTML="";

cats.forEach((cat,i)=>{

const b=document.createElement("button");

b.className="cat"+(i===0?" active":"");
b.textContent=cat;

b.onclick=()=>showCategory(name,cat,b);

categories.appendChild(b);

});

if(cats.length){

showCategory(
name,
cats[0],
categories.firstElementChild
);

}else{

itemsBox.innerHTML=
'<div class="empty">لا توجد أصناف مسجلة في هذا القسم</div>';

}

panel.scrollIntoView({
behavior:"smooth",
block:"start"
});

}

/* عرض التصنيف */
function showCategory(section,category,button){

[...categories.children].forEach(b=>
b.classList.toggle("active",b===button)
);

const rows=allItems
.filter(x=>
x.section===section &&
(x.category||"أصناف متنوعة")===category
)
.sort(sortItems);

const isPhone=section==="دليل التليفونات الداخلية";

let html=isPhone?"":`
<div class="item-head">
<div>الصنف</div>
<div>سعر مدني</div>
<div>سعر عضو الدار</div>
</div>`;

html+=rows.map(x=>{

const note=x.notes?
`<div class="note">${esc(x.notes)}</div>`:"";

if(isPhone){

/* تحويل الأرقام العربية والفارسية إلى أرقام إنجليزية */
const phoneText=String(x.notes||"").trim();

const phoneLink=phoneText
.replace(/[٠-٩]/g,d=>"0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)])
.replace(/[۰-۹]/g,d=>"0123456789"["۰۱۲۳۴۵۶۷۸۹".indexOf(d)])
.replace(/[^0-9+]/g,"");

return `
<div class="item-row">
<div class="item-name">${esc(x.item)}</div>
<a class="phone-value"
   href="tel:${esc(phoneLink)}"
   aria-label="اتصال بـ ${esc(x.item)}">
   ${esc(phoneText||"—")}
</a>
</div>`;

}

return `
<div class="item-row">
<div class="item-name">
${esc(x.item)}
${note}
</div>
<div class="price">
${x.civilian_price==null?"—":esc(x.civilian_price)}
</div>
<div class="price">
${x.member_price==null?"—":esc(x.member_price)}
</div>
</div>`;

}).join("");

itemsBox.innerHTML=html||
'<div class="empty">لا توجد أصناف في هذا التصنيف</div>';

}

/* رسم الأزرار الخمسة */
function drawSections(){

home.innerHTML="";

SECTIONS.forEach(s=>{

const b=document.createElement("button");

b.className="section-card";

b.innerHTML=`
<div class="art">
${sectionArtwork(s.art)}
</div>
<span>${esc(s.name)}</span>
`;

b.onclick=()=>showSection(s.name);

home.appendChild(b);

});

}

/* تحميل المنيو من قاعدة البيانات */
async function loadMenu(){

try{

const r=await fetch("/api/menu",{
headers:{"accept":"application/json"}
});

if(!r.ok){
throw new Error("HTTP "+r.status);
}

const d=await r.json();

allItems=Array.isArray(d.items)?d.items:[];

drawSections();

}catch(e){

home.innerHTML=`
<div class="empty">
تعذر تحميل المنيو. تأكد من اتصال قاعدة البيانات ثم أعد المحاولة.
</div>`;

console.error("Menu loading error:",e);

}

}

loadMenu();

</script>

</body>
</html>
