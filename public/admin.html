<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082d25"><title>إدارة منيو نادي النسور</title><style>
:root{--g:#082d25;--gold:#d7b65f}*{box-sizing:border-box}body{margin:0;background:#f3f0e6;font-family:Tahoma,Arial,sans-serif;color:#23332d}header{background:var(--g);color:#f8e6ae;padding:18px;text-align:center;border-bottom:4px solid var(--gold)}main{max-width:1000px;margin:16px auto;padding:0 12px}.box{background:white;border:1px solid #e0d4b4;border-radius:12px;padding:14px;margin-bottom:14px}input,select,button{font:inherit;padding:11px;border:1px solid #cfc6af;border-radius:8px;width:100%;margin:4px 0}button{background:var(--g);color:#fff0bd;border:0;font-weight:bold}button.secondary{background:#75602b}button.danger{background:#9c3029}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.wide{grid-column:1/-1}.toolbar{display:grid;grid-template-columns:2fr 1fr;gap:8px}.row{border-bottom:1px solid #eee2c8;padding:10px 0}.row strong{display:block}.small{font-size:12px;color:#6b6b6b}.hidden{display:none}.actions{display:flex;gap:6px}.actions button{font-size:12px}.message{padding:9px;color:#765c18}.list{max-height:55vh;overflow:auto}@media(max-width:520px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}
</style></head><body><header><h2>لوحة إدارة منيو نادي النسور</h2><div>النسخة التجريبية المستقلة</div></header><main><section id="login" class="box"><h3>دخول الإدارة</h3><input id="password" type="password" placeholder="كلمة مرور الإدارة"><button onclick="login()">دخول</button><div id="loginMsg" class="message"></div></section><section id="app" class="hidden"><div class="box"><h3 id="formTitle">إضافة صنف</h3><div class="grid"><input id="section" placeholder="القسم"><input id="category" placeholder="التصنيف الداخلي"><input id="item" placeholder="اسم الصنف"><input id="civilian" type="number" step="0.01" placeholder="سعر مدني"><input id="member" type="number" step="0.01" placeholder="سعر عضو الدار"><input id="order" placeholder="الترتيب"><input id="notes" class="wide" placeholder="ملاحظات / رقم التليفون"></div><div class="actions"><button onclick="save()">حفظ</button><button class="secondary" onclick="resetForm()">إلغاء التعديل</button></div><div id="msg" class="message"></div></div><div class="box"><div class="toolbar"><input id="search" placeholder="بحث عن صنف أو قسم" oninput="render()"><button class="secondary" onclick="load()">تحديث القائمة</button></div><div id="list" class="list"></div><button class="danger" onclick="logout()">تسجيل الخروج</button></div></section></main></body><script>
let data=[],editing=null;const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginMsg').textContent=e.message}}
async function load(){try{data=(await api('/api/admin/items')).items||[];render()}catch(e){$('msg').textContent=e.message}}
function val(id){return $(id).value.trim()}function resetForm(){editing=null;['section','category','item','civilian','member','order','notes'].forEach(x=>$(x).value='');$('formTitle').textContent='إضافة صنف'}
async function save(){const b={section:val('section'),category:val('category'),item:val('item'),civilian_price:val('civilian'),member_price:val('member'),sort_order:val('order'),notes:val('notes')};try{if(editing)await api('/api/admin/items/'+editing,{method:'PUT',body:JSON.stringify(b)});else await api('/api/admin/items',{method:'POST',body:JSON.stringify(b)});$('msg').textContent='تم الحفظ';resetForm();await load()}catch(e){$('msg').textContent=e.message}}
function edit(id){const x=data.find(z=>z.id===id);if(!x)return;editing=id;$('formTitle').textContent='تعديل صنف رقم '+id;$('section').value=x.section;$('category').value=x.category;$('item').value=x.item;$('civilian').value=x.civilian_price??'';$('member').value=x.member_price??'';$('order').value=x.sort_order;$('notes').value=x.notes;window.scrollTo({top:0,behavior:'smooth'})}
async function del(id){if(!confirm('تأكيد حذف الصنف؟'))return;try{await api('/api/admin/items/'+id,{method:'DELETE'});await load()}catch(e){$('msg').textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=val('search').toLowerCase();const rows=data.filter(x=>[x.section,x.category,x.item].join(' ').toLowerCase().includes(q));$('list').innerHTML=rows.map(x=>`<div class="row"><strong>${esc(x.item)}</strong><div class="small">${esc(x.section)} / ${esc(x.category)} • مدني: ${x.civilian_price??'—'} • عضو: ${x.member_price??'—'}</div><div class="actions"><button onclick="edit(${x.id})">تعديل</button><button class="danger" onclick="del(${x.id})">حذف</button></div></div>`).join('')||'<div class="message">لا توجد نتائج</div>'}
async function logout(){await api('/api/admin/logout',{method:'POST'}).catch(()=>{});location.reload()}
</script></html>
